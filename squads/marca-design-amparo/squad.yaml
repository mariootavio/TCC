code: "marca-design-amparo"
name: "Marca & Design System — Amparo"
description: "Squad especialista no design system e manual de marca JÁ FINALIZADOS do Amparo (ver brand/ na raiz do projeto). Sob demanda, cria coisas NOVAS que fazem sentido para a marca — nunca altera o que já existe: novos componentes, telas do app, páginas da landing page, prompts de imagem, ou extensões de documentação do manual — sempre 100% derivadas dos tokens/paleta/tipografia/logo já travados. Quando o pedido exigir implementação visual real (não só um prompt/especificação em texto), constrói diretamente no Figma via MCP."
language: "Português (Brasil)"

# NOTA IMPORTANTE — Fonte única da verdade e ferramentas nativas:
# A identidade visual e o design system do Amparo estão FINALIZADOS e
# TRAVADOS em brand/design-system.md, brand/LogoAmparo.svg e
# brand/manual-amparo.pdf (ver brand/README.md). Nenhum agente desta squad
# cria uma nova identidade, cor, fonte ou logo — o trabalho é sempre
# EXTENSÃO (adicionar algo novo e coerente) ou DOCUMENTAÇÃO/PROMPT (texto),
# nunca alteração do que já existe.
#
# Esta squad usa DUAS ferramentas/skills nativas do ambiente Claude Code,
# equivalentes a "file read/write" — NÃO são skills do catálogo Opensquad,
# por isso não aparecem em `skills:` abaixo:
#   - Ferramentas MCP do Figma (`use_figma` e as skills `figma-use`,
#     `figma-generate-library`, `figma-generate-design`) — usadas por Tomás
#     Tokens (Step 4) para implementar componentes/telas/páginas
#     diretamente no arquivo Figma do Amparo, SOMENTE quando o pedido do
#     usuário pedir implementação (não apenas o prompt/especificação).
#   - `manual-identidade-visual-premium` (Skill tool) — usada por Flávia
#     Fonte (Step 2, como referência de qualidade/anatomia de componentes e
#     linguagem fotográfica) e por Helena Manual (Step 6, como referência
#     de estrutura/vocabulário para o apêndice do manual), sem precisar
#     invocar a skill inteira toda vez — arquivos de `references/`/`assets/`
#     lidos diretamente quando fizer sentido.

skills:
  - web_search
  - web_fetch
  - image-ai-generator

data:
  - pipeline/data/domain-framework.md
  - pipeline/data/quality-criteria.md
  - pipeline/data/output-examples.md
  - pipeline/data/anti-patterns.md
  - pipeline/data/direcao-imagens-ia.md

pipeline: "pipeline/pipeline.yaml"
