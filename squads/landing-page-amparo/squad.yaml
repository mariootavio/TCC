code: "landing-page-amparo"
name: "Landing Page — Amparo"
description: "Squad de copywriting, design e prototipagem que constrói a landing page premium do projeto Amparo inteiramente no Figma: estrutura e copy multi-público, especificação visual 100% derivada de brand/design-system.md, implementação real no Figma via MCP (seções, imagens geradas por IA, elementos de motion/dinamismo no protótipo) e revisão final de fidelidade à marca e qualidade. Suporta ajustes incrementais no mesmo arquivo Figma em execuções futuras."
language: "Português (Brasil)"

# NOTA IMPORTANTE — Fonte única da verdade e escopo do entregável:
# A identidade visual e o design system do Amparo estão FINALIZADOS e
# TRAVADOS em brand/design-system.md e brand/LogoAmparo.svg (ver
# brand/README.md). Todo agente que definir ou implementar visual usa
# exatamente esses valores — não existe mais cenário de "paleta
# provisória"/"pendente" (essa lógica antiga foi removida desta squad).
#
# O entregável final desta squad é 100% um arquivo Figma navegável — não
# há mais implementação em código (Next.js/React). Se um dia for necessário
# transformar esta landing page em código real, isso é tratado como uma
# etapa/squad futura separada, usando o arquivo Figma aprovado aqui como
# especificação de origem — nunca faz parte do pipeline desta squad, para
# que o Figma continue sendo o entregável principal e completo por si só.
#
# O componente de "Saída Rápida" (botão de saída de emergência) NÃO faz
# parte do escopo desta squad: ele exige comportamento funcional real
# (JS, listener de teclado) que um mockup Figma não pode implementar de
# verdade. Ficou fora do pipeline por decisão explícita do usuário — se a
# landing page virar código no futuro, esse requisito de segurança precisa
# ser reintroduzido na etapa de implementação.
#
# Esta squad usa ferramentas/skills nativas do ambiente Claude Code
# (equivalentes a "file read/write"), por isso não aparecem em `skills:`
# abaixo:
#   - Ferramentas MCP do Figma (`use_figma` e as skills `figma-use`,
#     `figma-generate-design`, `figma-generate-library`, `figma-use-motion`)
#     — usadas por Diego Assets (Step 6) para construir a landing page
#     completa no Figma, seção por seção, com variáveis/tokens espelhando
#     brand/design-system.md.
#   - `design-taste-frontend`, `high-end-visual-design`, `frontend-design`
#     — usadas por Vitória Visual (Step 4) para traduzir o design system da
#     marca em composição/hierarquia/ritmo de alto padrão, nunca para
#     inventar cor/fonte fora da marca.

skills:
  - web_search
  - web_fetch
  - image-ai-generator

data:
  - pipeline/data/research-brief.md
  - pipeline/data/quality-criteria.md
  - pipeline/data/output-examples.md
  - pipeline/data/anti-patterns.md
  - pipeline/data/domain-framework.md
  - pipeline/data/direcao-imagens-ia.md

pipeline: "pipeline/pipeline.yaml"
