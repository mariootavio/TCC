code: "landing-page-amparo"
name: "Landing Page — Amparo"
description: "Squad de design, UX/UI e front-end que constrói o código real (React/Next.js) da landing page do projeto Amparo: estrutura e copy multi-público, especificação visual baseada na identidade da marca-design-amparo, implementação front-end com shadcn/ui, animações modernas (Framer Motion + GSAP + View Transitions), e revisão final de qualidade/acessibilidade. Inclui o padrão obrigatório de Saída Rápida para sites de apoio a vítimas de violência doméstica."
language: "Português (Brasil)"

# NOTA IMPORTANTE sobre o código real do site (não confundir com squads/{code}/output/):
# Esta squad produz, além dos artefatos de processo abaixo, um projeto Next.js REAL e
# persistente em um diretório FORA deste repositório (decisão do usuário, para não
# sobrecarregar o projeto acadêmico do TCC com node_modules/build de um app Next.js).
# O caminho absoluto exato é perguntado ao usuário no checkpoint do Step 1 e registrado
# em squads/landing-page-amparo/output/inputs-e-referencias.md — não é fixo neste arquivo
# porque pode mudar a cada ambiente/máquina. Esse projeto NÃO vive em
# squads/landing-page-amparo/output/ porque não é um artefato de conteúdo escopado por
# run_id — é um código-fonte que evolui entre execuções da squad. Fábio Front-end (step 6)
# e Mariana Movimento (step 7) escrevem/editam arquivos ali diretamente, lendo o caminho
# confirmado em inputs-e-referencias.md.
#
# NOTA sobre skills externas (não confundir com `skills:` abaixo, que é o catálogo Opensquad):
# As skills a seguir foram instaladas via `npx skills add` (skills.sh) em `.claude/skills/`
# e são carregadas em tempo de execução via a ferramenta Skill nativa do Claude Code —
# não são integrações MCP/API do catálogo Opensquad:
#   - design-taste-frontend, high-end-visual-design, frontend-design — usadas por Vitória
#     Visual (step 4) e como referência por Fábio Front-end (step 6).
#   - shadcn, vercel-react-best-practices, vercel-composition-patterns,
#     full-output-enforcement — usadas por Fábio Front-end (step 6).
#   - gpt-taste, vercel-react-view-transitions, full-output-enforcement — usadas por
#     Mariana Movimento (step 7).
#   - web-design-guidelines, wcag-audit-patterns — usadas por Rafael Rigor (step 9).
#     wcag-audit-patterns já estava instalada no projeto (reaproveitada de fluxos-uxui-amparo).

skills:
  - web_search
  - web_fetch

