    - text: "Ajuste solicitado no checkpoint (Step 6): o usuário aprovou esta direção, mas pediu paleta mais pastel, puxada para rosa e tons frios — tom mais próximo de \"healthy\"/bem-estar e mais feminino do que a versão original em terracota quente. Substituídos: #C97B5B → #E8A8B4 (rosa pastel), #E8C9B0 → #B7C4E0 (azul-lilás pastel, mantendo a base fria trauma-informada do brief), #5B6B8C → #8B7FB8 (lilás mais profundo como acento de uso restrito). Nenhuma das cores é vermelho/laranja saturado — a restrição do brief continua respeitada."
    - text: "Regra de uso (documentada para Tomás): texto de corpo e UI padrão sempre em neutro escuro (#3A3341), sobre neutro claro, primária ou secundária — todos os três pares atingem AA em texto normal (6.2:1 a 13.4:1). O acento lilás profundo (#8B7FB8) é reservado a títulos grandes, chips e estados de destaque — nunca texto de corpo (3.4:1)."