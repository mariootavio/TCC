  - paragraph [ref=e4]: Proteção que cabe na palma da mão.
  - paragraph [ref=e6]: "O Amparo nasce de uma barreira real: pedir ajuda, quando se está em situação de violência doméstica, é muitas vezes mais arriscado do que ficar em silêncio. Medo, dependência, vergonha e falta de informação se somam — e o agressor pode estar a um olhar de distância da tela do celular."
  - paragraph [ref=e7]: "Por isso o Amparo é discreto por princípio: uma plataforma que reúne emergência, documentação segura e rede de apoio num único lugar, sem nunca expor, no ícone ou no nome, o motivo pelo qual está ali."
  - paragraph [ref=e8]: "Para mulheres em situação de risco — majoritariamente negras, entre 18 e 44 anos — o Amparo promete o que o nome já diz: companhia segura, mesmo quando ninguém mais está por perto."
