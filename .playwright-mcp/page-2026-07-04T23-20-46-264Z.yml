  - generic [ref=f11e14]:
    - text: "Anatomia: símbolo final (logo fornecida pelo usuário), recortado sem o wordmark \"Amparo\" — o ícone do app usa apenas o símbolo, ocupando ~65% do diâmetro útil."
    - text: "Especificações técnicas: símbolo recortado do arquivo-fonte do logo (`identity/assets/logo-symbol.png`, variação clara, e `logo-symbol-white.png`, variação escura — ambos derivados de `logo.png`/`.svg`, sem o wordmark). Recomenda-se re-exportar em 1024×1024px a partir do arquivo vetorial para produção. Cantos com máscara de superellipse (22.5%) aplicada pelo próprio sistema operacional."
    - text: "Regras de uso: nunca usar a cor de acento lilas-500 como fundo do ícone (baixo contraste com o símbolo); nunca incluir o wordmark \"Amparo\" no ícone (só o símbolo); a variação escolhida (clara/escura) deve seguir o tema do sistema operacional do dispositivo."
    - text: "Erros a evitar: ❌ símbolo ocupando menos de 60% do diâmetro (perde presença); ❌ adicionar sombra ou brilho ao símbolo; ❌ qualquer elemento textual \"SOS\"/\"ajuda\"/\"emergência\" visível no ícone."