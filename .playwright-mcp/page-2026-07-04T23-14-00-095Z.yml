  - heading "Ícone do App (iOS/Android) + Tela Inicial" [level=1] [ref=f8e3]
  - generic [ref=f8e4]: "Objetivo: discrição visual como requisito de segurança — o ícone precisa ser bonito e reconhecível para a usuária, sem expor o propósito do app a quem vê a tela de relance. Variações claro/escuro seguem a regra de foto de perfil (60-70% do diâmetro útil ocupado pelo símbolo)."
