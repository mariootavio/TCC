      - img "Símbolo Amparo" [ref=f8e8]
      - generic [ref=f8e9]: Variação clara — símbolo final (recorte, sem wordmark) sobre paper-50
    - generic [ref=f8e10]:
      - img "Símbolo Amparo" [ref=f8e12]
